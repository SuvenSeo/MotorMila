<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motormila — The fair mila for every motor.</title>
    <meta
      name="description"
      content="Motormila tracks Sri Lankan vehicle listings, price trends, district coverage, deal signals, and valuation tools in one market intelligence cockpit."
    />
    <meta name="author" content="Motormila" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f4ee" />
    <script>
      /* Pre-paint theme bootstrap — applies the saved/default theme before
         first paint so there is no flash of the wrong palette. Dark is default. */
      (function () {
        try {
          var mode = localStorage.getItem("motormila_theme_mode") || localStorage.getItem("autolens_theme_mode") || "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(dark ? "theme-dark" : "theme-light");
          root.style.colorScheme = dark ? "dark" : "light";
          var fontChoice = localStorage.getItem("motormila_font_choice") || "satoshi-inter";
          var fontScope = localStorage.getItem("motormila_font_scope") || "hybrid";
          root.setAttribute("data-theme-font", fontChoice);
          root.setAttribute("data-font-scope", fontScope);
        } catch (e) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- Production type: Satoshi (display) + Inter (body) + JetBrains Mono.
         Non-blocking (print->all swap) with font-display=swap; the other
         FontStudio families load only when a saved choice needs them (below). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap" />
    </noscript>
    <script>
      /* Optional families for non-default FontStudio choices (dev tool / saved prefs). */
      (function () {
        try {
          var choice = document.documentElement.getAttribute("data-theme-font") || "satoshi-inter";
          var extra = {
            "general-sans-inter": "https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap",
            "general-sans-pure": "https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap",
            "clash-display": "https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap",
            "sora-inter": "https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap",
            "satoshi-pure": "https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
          }[choice];
          if (extra) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = extra;
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Motormila — Vehicle Intelligence for Sri Lanka" />
    <meta
      property="og:description"
      content="Track Sri Lankan vehicle prices, trends, deal signals, and valuation tools in one market intelligence cockpit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://motormila.vercel.app/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
