<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motormila — The fair mila for every motor.</title>
    <meta
      name="description"
      content="Motormila tracks Sri Lankan vehicle listings, price trends, district coverage, deal signals, and valuation tools in one market intelligence cockpit."
    />
    <meta name="author" content="Motormila" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f4ee" />
    <script>
      /* Pre-paint theme bootstrap — applies the saved/default theme before
         first paint so there is no flash of the wrong palette. Dark is default. */
      (function () {
        try {
          var mode = localStorage.getItem("motormila_theme_mode") || localStorage.getItem("autolens_theme_mode") || "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.add(dark ? "theme-dark" : "theme-light");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <!-- Type: Cal Sans, self-hosted (src/styles/fonts.css, OFL in /fonts/cal-sans/OFL.txt).
         Preload only the two faces above the fold: Text 400 (body) and Display 600 (headlines). -->
    <link rel="preload" href="/fonts/cal-sans/cal-sans-text-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cal-sans/cal-sans-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Motormila — Vehicle Intelligence for Sri Lanka" />
    <meta
      property="og:description"
      content="Track Sri Lankan vehicle prices, trends, deal signals, and valuation tools in one market intelligence cockpit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://motormila.vercel.app/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Motormila" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Motormila — Vehicle Intelligence for Sri Lanka" />
    <meta
      name="twitter:description"
      content="Track Sri Lankan vehicle prices, trends, deal signals, and valuation tools in one market intelligence cockpit."
    />
    <meta name="twitter:image" content="https://motormila.vercel.app/og-card.jpg" />
    <!-- seo:route -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>

</html>
