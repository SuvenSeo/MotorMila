# Weekly Sri Lanka EV charger cache refresh.
#
# Page views never hit external charger APIs — they read local charge_points
# (or charging-stations.json snapshots). Uses Open Charge Map when configured,
# and falls back to OpenStreetMap Overpass when OPENCHARGEMAP_API_KEY is unset.

name: Weekly Open Charge Map cache

on:
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-ocm-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  neon-guard:
    name: Skip when Neon transfer quota is exhausted
    uses: ./.github/workflows/probe-neon.yml
    secrets: inherit

  neon-skipped:
    name: Neon blocked — SQLite pipeline still refreshes EV cache
    runs-on: ubuntu-latest
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available != 'true' }}
    steps:
      - run: |
          echo "Neon Free has blocked connections (monthly transfer quota)."
          echo "Skipping Neon EV cache write; manus-to-live.yml refreshes charge_points in SQLite & R2 snapshots."

  refresh-ocm:
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest Sri Lanka EV Charger POIs
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          OPENCHARGEMAP_API_KEY: ${{ secrets.OPENCHARGEMAP_API_KEY }}
          ALLOW_SQLITE_FALLBACK: "false"
          ENRICHMENT_OPEN_CHARGE_MAP: "true"
        run: python scripts/ingest_openchargemap.py
