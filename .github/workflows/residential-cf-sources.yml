# Cloudflare-walled sources (riyasewana, patpat) need a residential IP.
# The unified scraper now runs on GitHub-hosted runners so ikman and the
# other API/HTML sources keep updating when the laptop is off. This job is
# the laptop-only recrawl: it writes to Neon when the self-hosted runner is
# online and does not gate market analysis or snapshot export.
name: Residential Cloudflare Sources

on:
  schedule:
    # 08:00 Sri Lanka time = 02:30 UTC — after the hosted 02:00 unified run.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-residential-cf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  neon-guard:
    name: Skip when Neon transfer quota is exhausted
    uses: ./.github/workflows/probe-neon.yml
    secrets: inherit

  neon-skipped:
    name: Neon blocked — SQLite pipeline still live
    runs-on: ubuntu-latest
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available != 'true' }}
    steps:
      - run: |
          echo "Neon Free has blocked connections (monthly transfer quota)."
          echo "Residential Cloudflare scrapes write to Neon, so they skip until quota resets."
          echo "Listings and scrapes continue via manus-to-live.yml (merged SQLite + snapshots)."

  scrape-source:
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available == 'true' }}
    # Was `runs-on: self-hosted`, which meant it could never run at all: the
    # laptop runner has been offline for weeks, so the only workflow designed to
    # give riyasewana/patpat a residential IP was silently dead. Hosted runners
    # work fine here because the residential IP now comes from the proxy
    # provider (SCRAPE_PROXY_URL) rather than from where the runner sits.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.source == 'riyasewana' && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        source: [riyasewana, patpat]

    outputs:
      has_proxy: ${{ steps.proxy.outputs.configured }}

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check Python
        run: |
          python --version
          python -m pip --version

      - name: Check for a configured residential proxy
        # patpat.lk and saleme.lk only serve listings to residential/ISP IPs.
        # Without a proxy they hand every hosted runner a Cloudflare
        # interstitial, so detect the missing secret up front and skip cleanly
        # rather than failing red (or burning the budget on a wall).
        id: proxy
        env:
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
        run: |
          if [ -z "${SCRAPE_PROXY_URL}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SCRAPE_PROXY_URL is not set, so ${{ matrix.source }} cannot be"
            echo "::notice::reached (it is Cloudflare-walled to datacenter IPs). Skipping."
            echo "::notice::Set the SCRAPE_PROXY_URL repo secret to reactivate this workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Residential proxy configured; scraping ${{ matrix.source }}."
          fi

      - name: Install dependencies
        if: steps.proxy.outputs.configured == 'true'
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.proxy.outputs.configured == 'true'
        run: python -m playwright install chromium

      - name: Ensure schema (idempotent)
        if: steps.proxy.outputs.configured == 'true'
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        if: steps.proxy.outputs.configured == 'true'
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          SCRAPE_MAX_PAGES: "40"
          SCRAPE_MAX_PAGES_RIYASEWANA: "40"
          SCRAPE_MAX_PAGES_PATPAT: "30"
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_PATPAT: "2400"
          RIYASEWANA_ARCHIVE_FALLBACK: "0"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: residential-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/debug_*.html
          retention-days: 7
