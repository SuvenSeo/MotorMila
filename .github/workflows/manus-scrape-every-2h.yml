name: Manus Scrape Dump (3x Daily)

on:
  schedule:
    # Runs at 07:40, 15:40, and 23:40 Sri Lanka Time (02:10, 10:10, 18:10 UTC).
    # 3x daily with an incremental page budget prevents IP blocks and avoids
    # redundant scrapes while capturing fresh listings cleanly.
    # The :10 offset keeps this clear of 02:00 UTC, where daily-scrape and the
    # manus-to-live fallback both fire — simultaneous starts contended for the DB.
    - cron: "10 2,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A delayed run queues instead of cancelling an active scrape, preventing
# competing SQLite dumps and duplicate source traffic.
concurrency:
  group: manus-scrape-dump-cadence
  cancel-in-progress: false

jobs:
  scrape-and-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      MANUS_MAX_PAGES: "30"
      # Each source is bounded so a blocked marketplace cannot prevent later
      # sources or the dump upload from running. The hard `timeout` kill wraps
      # this with MANUS_SOURCE_KILL_GRACE_SECONDS of headroom so run_sync can
      # still finalize its ScrapeRun row before being killed.
      MANUS_SOURCE_TIMEOUT_SECONDS: "600"
      MANUS_SOURCE_KILL_GRACE_SECONDS: "60"
      BOT_CONTACT: ${{ vars.BOT_CONTACT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Scrape sources and upload dump
        # riyasewana runs in its own job below so a block there cannot stop
        # this dump. ikman is crawled here like every other source in the
        # list (public HTML only, robots-first; re-enabled by owner decision
        # 22 Oct 2026 after a 19-22 Oct pause).
        run: |
          bash backend/scripts/ops/manus_scrape_dump.sh \
            ikman autolanka auto-lanka hitad autostream saleme riyahub carshop dimo autodirect cartivate

      - name: Upload local dump if delivery failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manus-scrape-failure-${{ github.run_id }}
          path: backend/motormila.db.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL unset — scrape failure not alerted"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Motormila manus scrape failed (run ${GITHUB_RUN_ID}). Check artifacts.\"}" \
            "$SLACK_WEBHOOK_URL"

  walled-sources:
    name: riyasewana (honest single attempt; skipped if blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    # Legal policy (docs/legal/data-sourcing.md): one attempt per cycle with
    # the honest MotorMilaBot UA. No matrix of runner-IP draws, no proxies.
    # If riyasewana blocks us the job records it and we back off.
    concurrency:
      group: manus-walled-sources-${{ github.run_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MANUS_MAX_PAGES: "30"
      MANUS_SOURCE_TIMEOUT_SECONDS: "600"
      MANUS_SOURCE_KILL_GRACE_SECONDS: "60"
      MANUS_RELEASE_TAG_SUFFIX: w1
      BOT_CONTACT: ${{ vars.BOT_CONTACT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Scrape riyasewana and upload dump
        run: |
          bash backend/scripts/ops/manus_scrape_dump.sh riyasewana

      - name: Record blocked attempt
        # A blocked run aborts the script before it uploads, so the release is
        # simply absent. Surfacing it here keeps the retries visible in the UI.
        if: failure()
        run: |
          echo "::warning::riyasewana was blocked or failed; backing off until the next cycle (no evasion)."
