# Firebase Test Lab — real-device testing for Motormila Android.
# Runs on every PR touching android/ and on manual dispatch.
# Uses the free Spark plan quota (virtual devices). Requires the
# FIREBASE_TEST_LAB_KEY repo secret (GCP service account JSON).
name: Firebase Test Lab

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/firebase-test-lab.yml"
  workflow_dispatch:

jobs:
  test-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Robo test on virtual Pixel
        # Robo test crawls the app automatically for 3 minutes on a virtual
        # Pixel 7 (API 34). Catches crashes, ANRs, and broken navigation
        # without writing instrumentation tests.
        run: |
          gcloud firebase test android run \
            --project motormila-86154 \
            --type robo \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --device model=panther,version=34,locale=en,orientation=portrait \
            --timeout 180s \
            --results-bucket motormila-test-lab \
            2>&1 | tee test-lab-output.txt

      - name: Check for crashes
        run: |
          if grep -qiE "crashed|failed|inconclusive" test-lab-output.txt; then
            echo "::error::Firebase Test Lab reported failures — see log above"
            exit 1
          fi
          echo "Test Lab run clean."
