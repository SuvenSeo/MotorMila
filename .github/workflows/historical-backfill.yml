name: Historical Data Backfill

# Max densify: seed DMT/policy, import Kaggle + community CSVs, Wayback
# (ikman brands/models + riyasewana), then Common Crawl densify. Writes ONLY to
# historical_price_observations / market_signals — never live car_listings.
#
# Trigger: Actions → Historical Data Backfill → Run workflow
# Also runs automatically on push to main when historical backfill code changes.

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Seed DMT + policy market_signals"
        type: boolean
        default: true
      run_csv_import:
        description: "Import Kaggle SL CSV into historical_price_observations"
        type: boolean
        default: true
      run_community_csv:
        description: "Import community riyasewana-derived CSV (archive only)"
        type: boolean
        default: true
      run_wayback:
        description: "Max Wayback backfill (ikman brands/models + riyasewana)"
        type: boolean
        default: true
      run_common_crawl:
        description: "Common Crawl densify for ikman/riyasewana SERPs"
        type: boolean
        default: true
      wayback_max_snapshots_per_url:
        description: "Max monthly CDX hits kept per SERP URL"
        type: number
        default: 30
      wayback_max_snapshots:
        description: "Optional global Wayback snapshot cap (0 = no global cap)"
        type: number
        default: 600
      wayback_sleep:
        description: "Seconds between Wayback fetches"
        type: number
        default: 1.5
      cc_max_records:
        description: "Max Common Crawl WARC records to fetch"
        type: number
        default: 200
  push:
    branches: [main]
    paths:
      - "backend/app/services/historical_archive.py"
      - "backend/app/services/common_crawl_archive.py"
      - "backend/scripts/ops/backfill_wayback_prices.py"
      - "backend/scripts/ops/backfill_common_crawl_prices.py"
      - "backend/data/historical/**"
      - ".github/workflows/historical-backfill.yml"

concurrency:
  group: historical-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUNBUFFERED: "1"
      RUN_SEED: ${{ github.event_name == 'push' && 'true' || inputs.run_seed }}
      RUN_CSV: ${{ github.event_name == 'push' && 'true' || inputs.run_csv_import }}
      RUN_COMMUNITY_CSV: ${{ github.event_name == 'push' && 'true' || inputs.run_community_csv }}
      RUN_WAYBACK: ${{ github.event_name == 'push' && 'true' || inputs.run_wayback }}
      RUN_CC: ${{ github.event_name == 'push' && 'true' || inputs.run_common_crawl }}
      WAYBACK_PER_URL: ${{ github.event_name == 'push' && '30' || inputs.wayback_max_snapshots_per_url }}
      WAYBACK_MAX: ${{ github.event_name == 'push' && '600' || inputs.wayback_max_snapshots }}
      WAYBACK_SLEEP: ${{ github.event_name == 'push' && '1.5' || inputs.wayback_sleep }}
      CC_MAX: ${{ github.event_name == 'push' && '200' || inputs.cc_max_records }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure schema
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python - <<'PY'
          from db.session import init_db
          init_db()
          print("schema_ok")
          PY

      - name: Seed DMT + policy context
        if: ${{ env.RUN_SEED == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python scripts/ops/seed_market_context.py

      - name: Import Kaggle SL CSV → historical_price_observations only
        if: ${{ env.RUN_CSV == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          test -f data/historical/kaggle_sl_car_price_dataset.csv
          wc -l data/historical/kaggle_sl_car_price_dataset.csv
          python scripts/ops/import_historical_csv.py \
            data/historical/kaggle_sl_car_price_dataset.csv \
            --archive-source kaggle_sl \
            --price-unit lakhs \
            --observed-default 2025-01-15

      - name: Import community SL CSV → historical_price_observations only
        if: ${{ env.RUN_COMMUNITY_CSV == 'true' }}
        continue-on-error: true
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          mkdir -p /tmp/historical_seed
          curl -fsSL \
            "https://raw.githubusercontent.com/manojtharindu11/srilankan-used-car-price-predictor/main/collect%20data/data/sri_lankan_vehicles.csv" \
            -o /tmp/historical_seed/sri_lankan_vehicles.csv
          wc -l /tmp/historical_seed/sri_lankan_vehicles.csv
          python scripts/ops/import_historical_csv.py \
            /tmp/historical_seed/sri_lankan_vehicles.csv \
            --archive-source community_csv_riyasewana \
            --observed-default 2026-02-20

      - name: Wayback max densify (ikman + riyasewana)
        if: ${{ env.RUN_WAYBACK == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python scripts/ops/backfill_wayback_prices.py \
            --profile max \
            --from 20100101 \
            --to 20261231 \
            --max-snapshots-per-url "${WAYBACK_PER_URL}" \
            --max-snapshots "${WAYBACK_MAX}" \
            --sleep "${WAYBACK_SLEEP}" \
            --commit-every 5

      - name: Common Crawl densify
        if: ${{ env.RUN_CC == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python scripts/ops/backfill_common_crawl_prices.py \
            --max-records "${CC_MAX}" \
            --crawl-limit 12 \
            --sleep 1.0
