name: Debug APK

on:
  push:
    branches: [debug-apk/2e4197ca]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug-apk/2e4197ca

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then SDKMANAGER="$candidate"; break; fi
          done
          if [[ -n "$SDKMANAGER" ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" >/dev/null || true
          fi

      - name: Build direct debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDirectDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: motormila-debug-apk
          path: android/app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
          retention-days: 14
