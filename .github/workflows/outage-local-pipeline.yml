# OUTAGE-ONLY pipeline — laptop SQLite publish path used while Neon refused
# connections (Aug 2026 quota). Neon reset on Sept 1; the canonical pipeline
# is daily-scrape.yml writing to HOT_DATABASE_URL. Keep this file for a future
# outage (manual dispatch only) so it no longer queues on the offline laptop
# runner and cancels the real Neon jobs.
name: Outage Local Pipeline (laptop)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      skip-riyasewana:
        description: "Skip riyasewana (Cloudflare throttling it) and publish with existing data"
        type: boolean
        default: false

# Separate concurrency group from the Neon workflows.
concurrency:
  group: outage-local-${{ github.ref }}
  cancel-in-progress: false

env:
  COLD_DATABASE_URL: sqlite:///C:/motormila/motormila.db

jobs:
  scrape-source:
    # Laptop self-hosted runner: residential IP dodges Cloudflare rate-limits.
    runs-on: self-hosted
    timeout-minutes: ${{ contains(fromJSON('["ikman","riyasewana"]'), matrix.source) && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # saleme intentionally excluded: its serial detail-fetch never finishes
        # within the 60-min job timeout and blocks the whole publish chain.
        # riyasewana can be skipped on demand via the skip-riyasewana dispatch
        # input (Cloudflare sometimes rate-limits it into a slow retry loop).
        source: ${{ fromJSON(inputs.skip-riyasewana == true && '["ikman", "patpat", "autolanka", "auto-lanka", "autodirect", "autostream", "carshop", "riyahub", "dimo", "hitad", "cartivate"]' || '["ikman", "riyasewana", "patpat", "autolanka", "auto-lanka", "autodirect", "autostream", "carshop", "riyahub", "dimo", "hitad", "cartivate"]') }}

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Python
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Validate scraper modules compile
        run: |
          python -m py_compile \
            run_sync.py \
            app/scrapers/ikman.py \
            app/scrapers/riyasewana.py \
            app/scrapers/patpat.py \
            app/scrapers/autolanka.py \
            app/scrapers/auto_lanka_site.py \
            app/scrapers/autodirect.py \
            app/scrapers/autostream.py \
            app/scrapers/generic_detail.py \
            app/scrapers/carshop.py \
            app/scrapers/saleme.py \
            app/scrapers/riyahub.py \
            app/scrapers/dimo.py \
            app/scrapers/hitad.py \
            app/scrapers/cartivate.py \
            app/services/market_signals.py \
            app/services/aggregator.py

      - name: Ensure schema (idempotent)
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        env:
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          SCRAPE_MAX_PAGES: "20"
          SCRAPE_MAX_PAGES_ALT: "20"
          SCRAPE_MAX_PAGES_IKMAN: "120"
          SCRAPE_MAX_PAGES_RIYASEWANA: "120"
          SCRAPE_MAX_PAGES_PATPAT: "30"
          SCRAPE_MAX_PAGES_AUTOLANKA: "30"
          SCRAPE_MAX_PAGES_AUTO_LANKA_SITE: "30"
          SCRAPE_MAX_PAGES_AUTODIRECT: "30"
          SCRAPE_MAX_PAGES_AUTOSTREAM: "30"
          SCRAPE_MAX_PAGES_CARSHOP: "30"
          SCRAPE_MAX_PAGES_SALEME: "30"
          SCRAPE_MAX_PAGES_RIYAHUB: "30"
          SCRAPE_MAX_PAGES_DIMO: "30"
          SCRAPE_MAX_PAGES_HITAD: "30"
          SCRAPE_MAX_PAGES_CARTIVATE: "30"
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_ALT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_IKMAN: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_PATPAT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOLANKA: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTO_LANKA_SITE: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTODIRECT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOSTREAM: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARSHOP: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_SALEME: "2700"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYAHUB: "2700"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_DIMO: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_HITAD: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARTIVATE: "2400"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outage-scrape-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/*.db
            backend/debug_*.html
          retention-days: 7

  merge-manus-dump:
    # Pulls the newest manus-scrape-* release/dump from GitHub and merges it
    # into the local DB (by source, source_id) so Manus cloud scrapes flow
    # into the site automatically. Skips silently when there is no dump yet.
    runs-on: self-hosted
    needs: scrape-source
    if: ${{ !cancelled() }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Pull latest Manus dump and merge into local DB
        run: |
          set -euo pipefail
          # The repo is public, so release listing + asset download need no auth.
          RELEASES=$(curl -fsSL \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" || echo "[]")
          META=$(printf '%s' "$RELEASES" | python -c "import json,sys; rels=json.load(sys.stdin); print(next((r['assets'][0]['browser_download_url'] for r in rels if (r.get('tag_name') or '').startswith('manus-scrape-') and r.get('assets')), ''))" 2>/dev/null || echo "")
          if [ -z "$META" ]; then
            echo "no manus-scrape dump found — skipping merge"
            exit 0
          fi
          echo "pulling $META"
          curl -fsSL -L -o manus-dump.db.gz "$META"
          python scripts/ops/merge_sqlite_dump.py manus-dump.db.gz
          rm -f manus-dump.db.gz

  market-analysis:
    runs-on: self-hosted
    needs: [scrape-source, merge-manus-dump]
    if: ${{ !cancelled() }}
    timeout-minutes: 180

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run market analysis once
        env:
          SCRAPE_PROFILE: "all"
          RUN_SCRAPERS: "false"
          RUN_MARKET_ANALYSIS: "true"
          RUN_MARKET_SIGNALS: "true"
          RUN_DEAL_SCORE_REFRESH: "true"
          RUN_STATS_CACHE_REFRESH: "true"
          RUN_DEDUP: "true"
          RUN_LISTING_LIFECYCLE: "true"
          RUN_OUTLIER_DETECTION: "true"
          RUN_PRICE_RECOVERY: "true"
          RUN_ALERT_MATCH: "true"
          RUN_THUMBNAIL_CACHE: "true"
          RUN_IMAGE_PHASH: "true"
        run: python run_sync.py

  snapshot-export:
    runs-on: self-hosted
    needs: [scrape-source, market-analysis]
    if: ${{ !cancelled() && needs.market-analysis.result == 'success' }}
    timeout-minutes: 90

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Full export (not --skip-catalog): the local DB is the ONLY catalog
      # during the outage, so the site's listing parts must come from it.
      - name: Export public snapshots
        working-directory: backend
        run: python export_public_snapshots.py --output snapshots/latest

      # Publish the laptop's full DB (all 12 sources, incl. patpat/auto-lanka
      # which the Manus dumps don't cover) as a laptop-db-* release, so the
      # hosted manus-to-live.yml workflow can merge it into the shared merged
      # DB. That keeps the live catalog complete even while this laptop
      # pipeline is idle — the hosted workflow only needs this release to
      # exist, not the laptop to be online.
      - name: Publish laptop DB for hosted merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, os, shutil, sqlite3, urllib.request
          from datetime import datetime, timezone

          src = r"C:/motormila/motormila.db"
          if not os.path.exists(src):
              raise SystemExit("laptop DB not found at " + src)

          # sqlite3 backup API — WAL-safe (gzipping the raw file could miss
          # uncheckpointed WAL frames).
          dst = "motormila-backup.db"
          s = sqlite3.connect(src)
          d = sqlite3.connect(dst)
          s.backup(d)
          d.close()
          s.close()
          rows = sqlite3.connect(dst).execute(
              "SELECT COUNT(*) FROM car_listings"
          ).fetchone()[0]
          print("laptop db rows:", rows)

          # Never publish account/PII tables. The merge path only needs listings.
          con = sqlite3.connect(dst)
          for table in (
              "platform_users", "user_invites", "market_alerts",
              "market_alert_matches", "user_notifications", "user_feedback",
              "analytics_events", "dealer_profiles",
              "push_subscriptions", "notification_delivery_log",
          ):
              try:
                  con.execute(f'DELETE FROM "{table}"')
              except sqlite3.OperationalError:
                  pass
          con.commit()
          con.close()

          with open(dst, "rb") as fin, gzip.open("motormila.db.gz", "wb") as fout:
              shutil.copyfileobj(fin, fout)

          token = os.environ["GH_TOKEN"]
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          tag = f"laptop-db-{datetime.now(timezone.utc).strftime('%Y%m%dT%H%MZ')}"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases",
              data=json.dumps({
                  "tag_name": tag, "name": tag,
                  "body": f"Laptop full outage DB — {rows} listings",
                  "draft": False, "prerelease": True, "latest": False,
              }).encode(),
              headers={"Authorization": f"Bearer {token}",
                       "Accept": "application/vnd.github+json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              release = json.load(resp)
          with open("motormila.db.gz", "rb") as fh:
              payload = fh.read()
          for asset_name in ("motormila.db.gz", "autolens.db.gz"):  # legacy name second
              upload = urllib.request.Request(
                  f"https://uploads.github.com/repos/{repo}/releases/"
                  f"{release['id']}/assets?name={asset_name}",
                  data=payload,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/gzip"},
                  method="POST",
              )
              with urllib.request.urlopen(upload):
                  pass
          print("published", tag, "(assets motormila.db.gz + autolens.db.gz)")
          PY

      # Hand the snapshots to the hosted deploy job (it needs no DB access —
      # it just uploads the files to Vercel). Keeps the laptop runner free of
      # Node/npx requirements.
      - name: Upload snapshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outage-snapshots-${{ github.run_id }}
          path: backend/snapshots/latest
          retention-days: 3

  deploy-site:
    runs-on: ubuntu-latest
    needs: snapshot-export
    if: ${{ !cancelled() && needs.snapshot-export.result == 'success' }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download snapshots artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: outage-snapshots-${{ github.run_id }}
          path: snapshots-artifact

      # Copy the fresh snapshot set (stats + catalog parts + manifest) into the
      # deploy dir. The manifest being present makes deploy-snapshots-to-prod.sh
      # skip fetching the old Neon-era catalog from the live site.
      - name: Stage snapshots into public dir
        run: |
          mkdir -p public/snapshots/latest
          cp -r snapshots-artifact/. public/snapshots/latest/

      - name: Deploy snapshots to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_SOURCE_DIR: public/snapshots/latest
        run: bash scripts/deploy-snapshots-to-prod.sh
