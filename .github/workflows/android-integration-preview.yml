# TEMPORARY (android/integration branch only, deleted before merging to main).
# Compiles + tests both flavors, re-records the Paparazzi goldens that main's
# android.yml verifies (verifyPaparazziPlayDebug), commits them back to this
# branch, then runs verify + the unsigned R8 smoke build.
# Publishes nothing: no tag, no release, no R2, no manifest push.
name: Android integration preview (temp)

on:
  push:
    branches: [android/integration]

concurrency:
  group: android-integration-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[goldens]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android SDK
        working-directory: .
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || exit 0
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" >/dev/null || true
      - run: chmod +x gradlew
      - name: Compile direct + play
        run: ./gradlew :app:compileDirectDebugKotlin :app:compilePlayDebugKotlin --stacktrace
      - name: Unit tests (play + direct)
        run: ./gradlew :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest --stacktrace
      - name: Re-record Paparazzi goldens (play debug, same set main verifies)
        run: |
          set -euo pipefail
          rm -rf app/src/test/snapshots/images
          ./gradlew :app:recordPaparazziPlayDebug --stacktrace
          ls app/src/test/snapshots/images | wc -l
      - name: Verify Paparazzi goldens
        run: ./gradlew :app:verifyPaparazziPlayDebug --stacktrace
      - name: Commit goldens back to the branch
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android/app/src/test/snapshots
          if git diff --cached --quiet; then echo "goldens unchanged"; exit 0; fi
          git commit -m "test(android): re-record Paparazzi goldens (compileSdk 36, Paparazzi 2.0.0-alpha02) [goldens]"
          git push origin HEAD:android/integration
      - name: R8 release smoke build (unsigned, never published)
        run: >-
          ./gradlew :app:assemblePlayRelease :app:assembleDirectRelease :app:bundlePlayRelease
          -PmotormilaAllowUnsignedRelease=true --stacktrace
      - name: SDK levels
        working-directory: .
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "$BT/aapt2" dump badging android/app/build/outputs/apk/play/release/*.apk | grep -E "sdkVersion|targetSdkVersion|compileSdkVersion"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/src/test/snapshots/images/
          if-no-files-found: ignore
          retention-days: 7
