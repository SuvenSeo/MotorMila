name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No sdkmanager found under $ANDROID_HOME; relying on runner defaults"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Resolve sideload keystore
        working-directory: .
        env:
          # Mapped explicitly: without this the secret is invisible to the
          # step and the secret branch below could never run.
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          # Stage the effective signing identity to ONE fixed path, then hand
          # that PATH (never the raw base64 secret, never an empty string) to
          # Gradle via ANDROID_KEYSTORE_FILE. An empty value crashed Gradle
          # configuration on 2026-10-06 ("path may not be null or empty string").
          # Priority:
          # 1. ANDROID_KEYSTORE_FILE secret (a real, private release identity).
          # 2. The committed android/ci-signing.keystore — legacy shared dev
          #    identity, kept only so today's in-place updates keep working;
          #    rotate away from it (see docs/ANDROID_SIGNING.md).
          # In all cases the same signature must ship every release: a new
          # signature blocks in-place upgrades — do not reintroduce per-run
          # key generation.
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/motormila-sideload.keystore"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_FILE" | base64 --decode > "$KEYSTORE"
            echo "Using ANDROID_KEYSTORE_FILE secret for sideload signing."
          elif [ -f android/ci-signing.keystore ]; then
            cp android/ci-signing.keystore "$KEYSTORE"
            echo "WARNING: using the committed ci-signing.keystore (public, shared dev identity)."
            echo "Migrate to ANDROID_KEYSTORE_FILE; see docs/ANDROID_SIGNING.md."
          else
            echo "ERROR: no sideload identity — set the ANDROID_KEYSTORE_FILE secret or restore android/ci-signing.keystore"
            exit 1
          fi
          echo "MOTORMILA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          # Staged keystore path from the step above — always a valid path.
          # Password/alias/key-password fall back to the debug defaults in
          # build.gradle.kts when the matching secrets are unset.
          ANDROID_KEYSTORE_FILE: ${{ env.MOTORMILA_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motormila-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
