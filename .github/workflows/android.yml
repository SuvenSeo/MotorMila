name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No sdkmanager found under $ANDROID_HOME; relying on runner defaults"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # compileSdk/targetSdk 36 (Paparazzi 2.x renders against compileSdk).
          "$SDKMANAGER" "platforms;android-36" >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (play + direct)
        run: ./gradlew :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest --stacktrace

      - name: Verify Paparazzi snapshots
        # Visual regression: fails on any pixel diff vs the committed goldens
        # in android/app/src/test/snapshots/. Re-record locally with
        # ./gradlew :app:recordPaparazziPlayDebug and commit the updated goldens.
        run: ./gradlew :app:verifyPaparazziPlayDebug --stacktrace

      - name: Upload Paparazzi failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paparazzi-failures
          path: android/app/build/reports/paparazzi/
          if-no-files-found: ignore

      - name: R8 release smoke build (unsigned, never published)
        # Proves minify + resource shrinking + keep rules compile for both
        # channels. Unsigned on purpose: PR CI never sees signing secrets, and
        # the Gradle signing guard is bypassed only by this explicit flag.
        run: >-
          ./gradlew :app:assemblePlayRelease :app:assembleDirectRelease :app:bundlePlayRelease
          -PmotormilaAllowUnsignedRelease=true --stacktrace

      - name: Play policy guard (no install permission, no self-updater in play)
        working-directory: .
        run: |
          set -euo pipefail
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          PLAY_APK="$(ls android/app/build/outputs/apk/play/release/*.apk | head -1)"
          DIRECT_APK="$(ls android/app/build/outputs/apk/direct/release/*.apk | head -1)"
          "$AAPT2" dump permissions "$PLAY_APK" > play-perms.txt
          "$AAPT2" dump permissions "$DIRECT_APK" > direct-perms.txt
          cat play-perms.txt
          if grep -q "REQUEST_INSTALL_PACKAGES" play-perms.txt; then
            echo "ERROR: play flavor must not request REQUEST_INSTALL_PACKAGES"; exit 1
          fi
          if grep -qE "ACCESS_(FINE|COARSE)_LOCATION" play-perms.txt; then
            echo "ERROR: unused location permission is back in the play flavor"; exit 1
          fi
          grep -q "REQUEST_INSTALL_PACKAGES" direct-perms.txt || {
            echo "ERROR: direct flavor lost REQUEST_INSTALL_PACKAGES (self-updater cannot install)"; exit 1; }
          "$AAPT2" dump badging "$PLAY_APK" | grep -E "targetSdkVersion|sdkVersion"
          "$AAPT2" dump badging "$PLAY_APK" | grep -q "targetSdkVersion:'36'" || {
            echo "ERROR: targetSdk must be 36 (Play deadline 2026-11-01)"; exit 1; }

      - name: Guard against committed signing keys
        working-directory: .
        run: |
          set -euo pipefail
          # Only exception: the well-known debug/preview key (passwords "android"),
          # used solely by the debug build type of lk.motormila.app.debug.
          if git ls-files | grep -Ei '\.(jks|keystore|p12)$' | grep -vx 'android/app/preview-debug.keystore'; then
            echo "ERROR: a keystore is committed. Signing keys come from GitHub secrets only."; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motormila-unsigned-smoke
          path: |
            android/app/build/outputs/apk/play/release/*.apk
            android/app/build/outputs/apk/direct/release/*.apk
            android/app/build/outputs/mapping/
          if-no-files-found: warn
          retention-days: 7
