# Neon export — recover the 180k+ listing catalog after the monthly quota reset.
#
# Hitting Neon's free 5 GB/mo transfer quota does NOT delete data. It blocks
# every connection until the quota resets on the 1st of the next month. This
# workflow streams car_listings + price history into a gzipped SQLite dump and
# publishes it as a neon-export-* release. manus-to-live.yml merges that
# release into the public snapshot catalog (the live site).
#
# Previously scheduled daily (skipping once a month-tagged export existed) —
# now dispatch-only because the live site publishes from SQLite instead. Run
# it manually when a DR capture is actually needed; the monthly guard below
# still prevents accidental repeat full reads in the same calendar month.
#
# Requires repo secret HOT_DATABASE_URL (the Neon DSN).
#
# EGRESS NOTE: this is a full-table read (~80-300 MB). It is now DISPATCH-ONLY
# and must only run as a disaster-recovery capture — the live site no longer
# depends on it: manus-to-live.yml exports the public catalog from the merged
# SQLite DB with zero Neon reads (see docs/neon-egress-budget.md).
name: Neon Export (DR capture — dispatch only)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max listings to copy (0 = full export; small number = connectivity test)"
        type: number
        default: 0
      force:
        description: "Export even if a neon-export-* release already exists this month"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Skip if a full export already ran this month
        id: month
        env:
          FORCE: ${{ github.event.inputs.force || false }}
        run: |
          set -euo pipefail
          MONTH="$(date -u +%Y%m)"
          echo "month=${MONTH}" >> "$GITHUB_OUTPUT"
          python scripts/ops/discover_dump_releases.py --check-month-export "$MONTH" | tee month-check.txt
          if grep -q '^found=true$' month-check.txt && [[ "${FORCE}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A neon-export-${MONTH}* release already exists — skipping to protect the new quota. Re-run with force=true to override."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Neon (skip while quota-blocked)
        id: probe
        if: steps.month.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: secrets.HOT_DATABASE_URL is not set — add the Neon DSN in repo Settings → Secrets."
            exit 1
          fi
          python scripts/ops/export_neon_to_sqlite.py --probe

      - name: Export Neon to SQLite dump
        id: export
        if: steps.probe.outputs.neon_ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: |
          set -euo pipefail
          LIMIT="${{ github.event.inputs.limit || 0 }}"
          python scripts/ops/export_neon_to_sqlite.py --output motormila.db.gz --limit "${LIMIT}"

      - name: Publish dump release
        if: steps.export.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if [[ ! -f motormila.db.gz ]]; then
            echo "ERROR: export reported success but motormila.db.gz is missing"
            exit 1
          fi
          TAG="neon-export-$(date -u +%Y%m%dT%H%MZ)"
          cp motormila.db.gz autolens.db.gz  # legacy asset name for pre-rename merger runs
          gh release create "$TAG" motormila.db.gz autolens.db.gz \
            --title "$TAG" \
            --notes "Neon export (listings=${{ steps.export.outputs.listings || 'unknown' }}, history=${{ steps.export.outputs.history || 'unknown' }}). Merged into the live site automatically by manus-to-live.yml. Full-table read — do not re-run this month unless force=true." \
            --prerelease --latest=false
          echo "published ${TAG} — manus-to-live.yml will merge it shortly"
