# Hosted "scrapes → live site" pipeline for the Neon outage.
#
# During the outage the laptop pipeline (outage-local-pipeline.yml) was the
# ONLY thing that merged Manus dumps and published snapshots — and it depends
# on the laptop self-hosted runner being online. This workflow does the same
# job entirely on GitHub-hosted runners, so the live site keeps updating
# whenever a dump is published:
#   - Manus cloud scrapes      -> manus-scrape-* releases
#   - Laptop dedicated scrapes -> manus-scrape-dedicated-* releases
#   - Laptop full-DB uploads   -> laptop-db-* releases (patpat/auto-lanka)
#   - Post-reset Neon exports  -> neon-export-* releases
#
# It maintains a durable merged SQLite DB published as the `merged-db` release
# (merged-motormila.db.gz + last-merged.txt marker). Each run:
#   1. restores the merged DB (or starts fresh),
#   2. paginates every dump release newer than last-merged.txt (compares the
#      YYYYMMDDTHHMMZ timestamp so a full tag in the marker still works; the
#      dumps file always ends with a newline so a single pending dump is not
#      skipped by `wc -l` / `while read`),
#   3. runs market analysis + dedup,
#   4. publishes the merged DB + marker,
#   5. exports the public snapshots from the merged SQLite DB and deploys
#      them to Vercel — this is now the PERMANENT zero-egress catalog path:
#      the live site's listings refresh from SQLite and never read Neon.
name: Manus to Live (hosted merge and deploy)

on:
  workflow_run:
    # Run right after a Manus scrape completes and after a Neon export.
    # Match by exact workflow name. "Neon Export" is kept for older runs;
    # the live workflow is titled "Neon Export (DR capture — dispatch only)".
    workflows:
      - "Manus Scrape Dump (3x Daily)"
      - "Neon Export"
      - "Neon Export (DR capture — dispatch only)"
    types: [completed]
  schedule:
    # Fallback schedule every 6 hours (catches any missed dumps and retries cleanly).
    # The :25 offset keeps the merge/publish clear of the :00 scrape starts
    # (daily-scrape 02:00, manus-scrape 02:10), so it does not read the merged
    # DB while scrapers are launching writes.
    - cron: "25 */6 * * *"
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Force-merge this exact dump release tag (e.g. manus-scrape-20260814T1601Z)"
        required: false
        type: string
      publish-full-catalog:
        description: "Force a snapshot export+deploy even when no new dumps were merged (scheduled merges always deploy when new data lands)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Never run two merges at once — they share the merged-db release. A queued
# run just re-checks and exits early if there is nothing new.
concurrency:
  group: manus-to-live
  cancel-in-progress: false

env:
  COLD_DATABASE_URL: sqlite:///motormila.db
  MOTORMILA_LOCAL_DB: motormila.db
  ALLOW_SQLITE_FALLBACK: "true"
  GH_TOKEN: ${{ github.token }}

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore merged DB (or start fresh)
        run: |
          set -euo pipefail
          mkdir -p ../merged-store
          if gh release view merged-db >/dev/null 2>&1; then
            gh release download merged-db \
              --pattern "merged-motormila.db.gz" --pattern "merged-autolens.db.gz" --pattern "last-merged.txt" \
              --dir ../merged-store --clobber
            echo "downloaded merged-db release"
          fi
          DB_OK=false
          if [[ -s ../merged-store/merged-motormila.db.gz ]]; then
            gunzip -f -c ../merged-store/merged-motormila.db.gz > motormila.db
            DB_OK=true
            echo "restored merged DB ($(du -h motormila.db | cut -f1))"
          elif [[ -s ../merged-store/merged-autolens.db.gz ]]; then
            gunzip -f -c ../merged-store/merged-autolens.db.gz > motormila.db
            DB_OK=true
            echo "restored merged DB from legacy asset ($(du -h motormila.db | cut -f1))"
          fi
          # Guard against a partial release download: if the .gz is missing or
          # the restored file is not a real SQLite DB, the marker is untrustworthy
          # — drop it so discover_dump_releases re-scans from scratch instead of
          # skipping every prior dump and publishing an empty catalog.
          if [[ "$DB_OK" == "true" ]]; then
            if ! python -c "import sys; h=open('motormila.db','rb').read(16); sys.exit(0 if h.startswith(b'SQLite format 3\x00') else 1)"; then
              echo "restored file is not a SQLite DB — discarding marker"
              rm -f ../merged-store/last-merged.txt motormila.db
              DB_OK=false
            fi
          fi
          if [[ "$DB_OK" != "true" ]]; then
            rm -f ../merged-store/last-merged.txt
            python -c "from db.session import init_db; init_db(); print('fresh DB created')"
          fi

      - name: Discover new dump releases
        id: discover
        env:
          FORCE_TAG: ${{ github.event.inputs.release-tag || '' }}
        run: |
          set -euo pipefail
          python scripts/ops/discover_dump_releases.py \
            --last-merged-file ../merged-store/last-merged.txt \
            --out-dumps new-dumps.txt \
            --out-last last-merged-new.txt \
            --force-tag "${FORCE_TAG}"


      - name: Merge new dumps into merged DB
        if: steps.discover.outputs.count != '0'
        run: |
          set -euo pipefail
          mkdir -p dump-store
          while IFS= read -r TAG || [[ -n "${TAG}" ]]; do
            [[ -z "$TAG" ]] && continue
            echo "== merging ${TAG} =="
            if gh release download "$TAG" --pattern "motormila.db.gz" --dir dump-store --clobber; then
              ASSET="dump-store/motormila.db.gz"
            else
              gh release download "$TAG" --pattern "autolens.db.gz" --dir dump-store --clobber
              ASSET="dump-store/autolens.db.gz"  # legacy asset name
            fi
            python scripts/ops/merge_sqlite_dump.py "$ASSET" --target motormila.db
            rm -f dump-store/motormila.db.gz dump-store/autolens.db.gz
          done < new-dumps.txt
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("motormila.db")
          print("merged DB listings:", con.execute("SELECT COUNT(*) FROM car_listings").fetchone()[0])
          print("merged DB history:", con.execute("SELECT COUNT(*) FROM vehicle_price_history").fetchone()[0])
          PY

      - name: Run market analysis + dedup
        if: steps.discover.outputs.count != '0'
        env:
          SCRAPE_PROFILE: "all"
          RUN_SCRAPERS: "false"
          RUN_MARKET_ANALYSIS: "true"
          RUN_MARKET_SIGNALS: "true"
          RUN_DEAL_SCORE_REFRESH: "true"
          # Dedup marking DISABLED (2026-09-17): the make/model/year/price±3%
          # matcher was flagging >50% of the catalog as cross-source duplicates
          # (incl. distinct cars in different districts), collapsing public
          # live counts 207k → 106k. Keep off until the matcher requires
          # district + seller/photo evidence. The repair step below clears any
          # residual flags before every export so the catalog stays whole.
          RUN_DEDUP: "false"
          # Incremental (48h window) dedup — a full sweep re-reads 240k rows
          # and adds ~40 min to every merge. Full passes run on-demand via
          # heavy-maintenance.yml against SQLite (zero egress cost).
          DEDUP_FULL_PASS: "false"
          RUN_STATS_CACHE_REFRESH: "true"
          RUN_LISTING_LIFECYCLE: "true"
          RUN_OUTLIER_DETECTION: "true"
          # Skipped on hosted runners (network-heavy, not needed for export):
          RUN_ALERT_MATCH: "false"
          RUN_PRICE_RECOVERY: "false"
          RUN_THUMBNAIL_CACHE: "false"
          RUN_IMAGE_PHASH: "false"
        run: python run_sync.py

      - name: Repair duplicate flags (keep catalog whole)
        # Clears is_duplicate/duplicate_of set by earlier dedup passes so the
        # export counts every row. Same run condition as the export step so a
        # forced publish-full-catalog redeploy also heals.
        if: steps.discover.outputs.count != '0' || github.event.inputs.publish-full-catalog == 'true'
        env:
          COLD_DATABASE_URL: sqlite:///motormila.db
          MOTORMILA_LOCAL_DB: motormila.db
          ALLOW_SQLITE_FALLBACK: "true"
        run: python scripts/ops/repair_duplicate_flags.py --apply

      - name: Export and deploy SQLite snapshots (zero-egress catalog refresh)
        # Permanent path: whenever new dump data was merged, refresh the live
        # catalog from the merged SQLite DB (zero Neon reads) and deploy.
        # Manual runs with publish-full-catalog=true force a deploy even when
        # no new dumps landed (e.g. redeploying after a bad snapshot push).
        if: steps.discover.outputs.count != '0' || github.event.inputs.publish-full-catalog == 'true'
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOT_SOURCE_DIR: public/snapshots/latest
        run: |
          set -euo pipefail
          echo "Full catalog export from merged SQLite (zero Neon egress)"
          # Wipe user/PII tables BEFORE the export so the exporter never
          # reads them (JSON snapshots are CarListing-only today, but this
          # order is the safe default).
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("backend/motormila.db")
          for table in (
              "platform_users", "user_invites", "market_alerts",
              "market_alert_matches", "user_notifications", "user_feedback",
              "analytics_events", "dealer_profiles",
              # Device push endpoints/keys and delivery receipts are PII —
              # they must never ride a public artifact.
              "push_subscriptions", "notification_delivery_log",
          ):
              try:
                  con.execute(f'DELETE FROM "{table}"')
              except sqlite3.OperationalError:
                  # Legacy dumps may pre-date the table.
                  pass
          con.commit()
          con.close()
          PY
          COLD_DATABASE_URL="sqlite:///${GITHUB_WORKSPACE}/backend/motormila.db" python backend/export_public_snapshots.py --output backend/snapshots/latest
          mkdir -p public/snapshots/latest
          cp -r backend/snapshots/latest/. public/snapshots/latest/
          # Checkpoint WAL before gzip — otherwise unflushed -wal frames are lost.
          python -c "import sqlite3; c=sqlite3.connect('backend/motormila.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          gzip -f -c backend/motormila.db > public/snapshots/latest/merged-motormila.db.gz
          cp public/snapshots/latest/merged-motormila.db.gz public/snapshots/latest/merged-autolens.db.gz  # legacy name
          ls -lh public/snapshots/latest/merged-motormila.db.gz
          # Sideload APK + release manifest for /app/* (private repo: the
          # release asset can only be fetched with a token, and the binary is
          # gitignored, so it must ride the CLI deploy).
          bash scripts/fetch-apk-for-deploy.sh
          # Vercel failure (e.g. free-plan upload cap) must not block Cloudflare.
          VERCEL_OK=1
          bash scripts/deploy-snapshots-to-prod.sh || { VERCEL_OK=0; echo "::warning::Vercel deploy failed; continuing to Cloudflare"; }
          # Cloudflare Pages — permanent Vercel alternative (motormila.pages.dev).
          # Skipped if the Cloudflare secrets are not configured.
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            bash scripts/deploy-snapshots-to-cloudflare.sh
          else
            echo "NOTICE: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping Cloudflare deploy" >&2
          fi

      # Keep the R2 snapshot bucket fresh: the Cloudflare Pages build pulls
      # public/snapshots/latest from R2 at build time (scripts/sync-snapshots-from-r2.mjs)
      # when the bundled copy is stale, so every merge must publish the fresh
      # export there. Same layout the site expects: <prefix>/manifest.json, parts.
      - name: Upload fresh snapshots to R2
        if: steps.discover.outputs.count != '0' || github.event.inputs.publish-full-catalog == 'true'
        working-directory: ${{ github.workspace }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Canonical snapshot bucket (source of truth for the Pages
          # build-time sync). Set explicitly — there is no R2_BUCKET repo
          # secret; the uploader also accepts S3-style R2_* creds above.
          R2_BUCKET: motormila-snapshots
          R2_PREFIX: snapshots/latest
          SNAPSHOT_SOURCE_DIR: public/snapshots/latest
          # Cloudflare API fallback: the uploader uses this when the S3-style
          # R2_* credentials above are absent. The token needs R2 Storage
          # write permission on the bucket.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python backend/upload_snapshots_r2.py

      # Always advance the merge marker after a successful merge so a skipped
      # Vercel deploy (Neon is healthy) does not re-merge the same dumps.
      # Also persists the repaired DB on forced publish-full-catalog runs so
      # the healed flags survive (the export alone would not save them back).
      - name: Publish merged DB back to release
        if: steps.discover.outputs.count != '0' || github.event.inputs.publish-full-catalog == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          NEW_LAST="$(cat backend/last-merged-new.txt)"
          # Checkpoint WAL before gzip — otherwise unflushed -wal frames are lost.
          python -c "import sqlite3; c=sqlite3.connect('backend/motormila.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          gzip -f -c backend/motormila.db > merged-motormila.db.gz
          cp merged-motormila.db.gz merged-autolens.db.gz  # legacy asset name
          printf '%s' "$NEW_LAST" > last-merged.txt
          if gh release view merged-db >/dev/null 2>&1; then
            gh release upload merged-db merged-motormila.db.gz merged-autolens.db.gz last-merged.txt --clobber
          else
            gh release create merged-db merged-motormila.db.gz merged-autolens.db.gz last-merged.txt \
              --title "Merged outage DB" \
              --notes "Durable merged SQLite DB maintained by manus-to-live.yml. Last merged dump: ${NEW_LAST}" \
              --latest=false --prerelease
          fi
          echo "merged DB published (last merged: ${NEW_LAST})"

      - name: Print run summary
        if: always()
        run: |
          echo "== merged DB state =="
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("motormila.db")
          print("listings:", con.execute("SELECT COUNT(*) FROM car_listings").fetchone()[0])
          print("history:", con.execute("SELECT COUNT(*) FROM vehicle_price_history").fetchone()[0])
          print("live (active, non-outlier):",
                con.execute("SELECT COUNT(*) FROM car_listings WHERE is_active = 1 AND is_outlier = 0").fetchone()[0])
          PY

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: manus-to-live workflow failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"
