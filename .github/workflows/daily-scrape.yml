# Neon-backed archive scrapes. Public listings do NOT depend on this workflow:
# Manus → merged SQLite (`manus-to-live.yml`) is the live catalog. When Neon
# Free has exhausted monthly transfer quota, neon-guard skips every job here
# so we do not hammer a blocked database until the 1st.
name: Unified Vehicle Scraper

on:
  schedule:
    # 07:30 and 18:10 Sri Lanka time = 02:00 and 12:40 UTC
    - cron: "0 2 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:

# Separate group from midday so the two workflows never cancel each other.
# Keep cancel-in-progress false so a delayed morning run is not killed by evening.
concurrency:
  group: scrape-full-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  neon-guard:
    name: Skip when Neon transfer quota is exhausted
    uses: ./.github/workflows/probe-neon.yml
    secrets: inherit

  neon-skipped:
    name: Neon blocked — SQLite pipeline still live
    runs-on: ubuntu-latest
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available != 'true' }}
    steps:
      - run: |
          echo "Neon Free has blocked connections (monthly transfer quota)."
          echo "This workflow writes to Neon, so it is skipping until quota resets."
          echo "Listings and scrapes continue via manus-to-live.yml (merged SQLite + snapshots)."

  scrape-source:
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available == 'true' }}
    # GitHub-hosted: the laptop self-hosted runner has been offline for weeks,
    # so scheduled jobs sat queued and were cancelled by the next cron tick.
    # ikman (public JSON API) and most other sources work from datacenter IPs.
    # riyasewana + patpat are Cloudflare-walled here — those scrape steps are
    # allowed to fail so the rest of the fleet still writes to Neon.
    # Residential recrawl (when the laptop is on): residential-cf-sources.yml
    runs-on: ubuntu-latest
    # Heavy sources need setup (~10m) + scrape headroom. Lighter sources finish sooner.
    timeout-minutes: ${{ contains(fromJSON('["ikman","riyasewana"]'), matrix.source) && 180 || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [ikman, riyasewana, patpat, autolanka, auto-lanka, autodirect, autostream, carshop, saleme, riyahub, dimo, hitad, cartivate]

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Validate scraper modules compile
        run: |
          python -m py_compile \
            run_sync.py \
            app/scrapers/ikman.py \
            app/scrapers/riyasewana.py \
            app/scrapers/patpat.py \
            app/scrapers/autolanka.py \
            app/scrapers/auto_lanka_site.py \
            app/scrapers/autodirect.py \
            app/scrapers/autostream.py \
            app/scrapers/generic_detail.py \
            app/scrapers/carshop.py \
            app/scrapers/saleme.py \
            app/scrapers/riyahub.py \
            app/scrapers/dimo.py \
            app/scrapers/hitad.py \
            app/scrapers/cartivate.py \
            app/services/market_signals.py \
            app/services/aggregator.py

      - name: Ensure schema (idempotent)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        continue-on-error: ${{ contains(fromJSON('["riyasewana","patpat"]'), matrix.source) }}
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          # Lifecycle + outlier passes run once in the market-analysis job,
          # not in each of the parallel scrape jobs.
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          # Rescue-safe manual default. Use a separate full-refresh workflow if
          # a deeper scan is needed after the Supabase migration.
          SCRAPE_MAX_PAGES: "20"
          SCRAPE_MAX_PAGES_ALT: "20"
          # Routine daily runs use 25 pages to conserve DB connection time & egress.
          # Full backfills (120+ pages) are available on demand via *-bulk-backfill.yml.
          SCRAPE_MAX_PAGES_IKMAN: "25"
          SCRAPE_MAX_PAGES_RIYASEWANA: "25"
          SCRAPE_MAX_PAGES_PATPAT: "30"
          SCRAPE_MAX_PAGES_AUTOLANKA: "30"
          SCRAPE_MAX_PAGES_AUTO_LANKA_SITE: "30"
          SCRAPE_MAX_PAGES_AUTODIRECT: "30"
          SCRAPE_MAX_PAGES_AUTOSTREAM: "30"
          SCRAPE_MAX_PAGES_CARSHOP: "30"
          SCRAPE_MAX_PAGES_SALEME: "30"
          SCRAPE_MAX_PAGES_RIYAHUB: "30"
          SCRAPE_MAX_PAGES_DIMO: "30"
          SCRAPE_MAX_PAGES_HITAD: "30"
          SCRAPE_MAX_PAGES_CARTIVATE: "30"
          # Source timeouts must stay below job timeout minus setup (~10m).
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_ALT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_IKMAN: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "9000"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_PATPAT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOLANKA: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTO_LANKA_SITE: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTODIRECT: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_AUTOSTREAM: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARSHOP: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_SALEME: "2700"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYAHUB: "2700"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_DIMO: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_HITAD: "2400"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_CARTIVATE: "2400"
          # Hosted runners cannot pass riyasewana Cloudflare; don't hide that
          # behind a zero-insert Wayback fallback.
          RIYASEWANA_ARCHIVE_FALLBACK: "0"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scrape-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/*.db
            backend/debug_*.html
          retention-days: 7

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' (${{ matrix.source }}) failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  market-analysis:
    runs-on: ubuntu-latest
    needs: [neon-guard, scrape-source]
    if: ${{ needs.neon-guard.outputs.available == 'true' && always() && !cancelled() }}
    # EGRESS CONTROL: only SQL-side passes run daily (lifecycle + stats cache).
    # The Python-side full-table reads (dedup, outlier, aggregates, deal
    # scores) each stream the whole car_listings table to the runner — running
    # them daily burned ~2 GB/mo of Neon's 5 GB free transfer. They now run
    # weekly in heavy-maintenance.yml (budget-gated). Full pass is still
    # available on demand: Actions → heavy-maintenance → Run workflow.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SQL-side maintenance passes
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          RUN_SCRAPERS: "false"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_DEAL_SCORE_REFRESH: "false"
          RUN_STATS_CACHE_REFRESH: "true"
          RUN_DEDUP: "false"
          RUN_LISTING_LIFECYCLE: "true"
          RUN_OUTLIER_DETECTION: "false"
          RUN_PRICE_RECOVERY: "false"
          RUN_ALERT_MATCH: "false"
          RUN_THUMBNAIL_CACHE: "false"
          RUN_IMAGE_PHASH: "false"
        run: python run_sync.py

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  snapshot-export:
    runs-on: ubuntu-latest
    needs: [neon-guard, scrape-source, market-analysis]
    if: ${{ needs.neon-guard.outputs.available == 'true' && always() && !cancelled() && needs.market-analysis.result == 'success' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Export public snapshots (stats-only — catalog refreshes weekly)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python export_public_snapshots.py --output snapshots/latest --skip-catalog

      - name: Upload snapshots to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Canonical snapshot bucket (source of truth for the Pages
          # build-time sync). Set explicitly — there is no R2_BUCKET repo
          # secret; the uploader also accepts S3-style R2_* creds above.
          R2_BUCKET: motormila-snapshots
          R2_PREFIX: snapshots/latest
          SNAPSHOT_SOURCE_DIR: snapshots/latest
          # Cloudflare API fallback: the uploader uses this when the S3-style
          # R2_* credentials above are absent. The token needs R2 Storage
          # write permission on the bucket.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python upload_snapshots_r2.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Deploy snapshots to Vercel production
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_SOURCE_DIR: backend/snapshots/latest
        run: bash scripts/deploy-snapshots-to-prod.sh

      - name: Upload manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-snapshot-manifest-${{ github.run_id }}
          path: backend/snapshots/latest/manifest.json
          retention-days: 14

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"
