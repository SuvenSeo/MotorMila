# Neon-backed midday archive scrapes. When Neon transfer quota is exhausted
# this workflow skips; Manus → merged SQLite still refreshes the live catalog.
name: Midday Top Sources Scraper

on:
  schedule:
    # 12:00 Sri Lanka time = 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

# Separate from the full daily scrape so midday never cancels (or is cancelled by) it.
concurrency:
  group: scrape-midday-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  neon-guard:
    name: Skip when Neon transfer quota is exhausted
    uses: ./.github/workflows/probe-neon.yml
    secrets: inherit

  neon-skipped:
    name: Neon blocked — SQLite pipeline still live
    runs-on: ubuntu-latest
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available != 'true' }}
    steps:
      - run: |
          echo "Neon Free has blocked connections (monthly transfer quota)."
          echo "This workflow writes to Neon, so it is skipping until quota resets."
          echo "Listings and scrapes continue via manus-to-live.yml (merged SQLite + snapshots)."

  scrape-source:
    needs: neon-guard
    if: ${{ needs.neon-guard.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        source: [ikman, riyasewana]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Validate scraper modules compile
        run: |
          python -m py_compile \
            run_sync.py \
            app/scrapers/ikman.py \
            app/scrapers/riyasewana.py

      - name: Ensure schema (idempotent)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python -c "
          from db.session import init_db
          init_db()
          print('Schema ready.')
          "

      - name: Run scraper — ${{ matrix.source }}
        continue-on-error: ${{ matrix.source == 'riyasewana' }}
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: ${{ matrix.source }}
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          SCRAPE_MAX_PAGES: "30"
          SCRAPE_MAX_PAGES_IKMAN: "30"
          SCRAPE_MAX_PAGES_RIYASEWANA: "30"
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "3600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_IKMAN: "3600"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "3600"
          RIYASEWANA_ARCHIVE_FALLBACK: "0"
        run: python run_sync.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midday-scrape-${{ matrix.source }}-failure-${{ github.run_id }}
          path: |
            backend/*.log
            backend/*.db
            backend/debug_*.html
          retention-days: 7

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' (${{ matrix.source }}) failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  market-analysis:
    runs-on: ubuntu-latest
    needs: [neon-guard, scrape-source]
    if: ${{ needs.neon-guard.outputs.available == 'true' && always() && !cancelled() }}
    # First pass after a migration/dedup rebuild is heavy (deal scores,
    # lifecycle, outlier, thumbnail/phash backfill over the full table).
    timeout-minutes: 180

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market analysis once
        # Midday is analysis-light: lifecycle ran in the morning job and the
        # heavy Python-side full-table passes (dedup, outlier, aggregates,
        # deal scores) run weekly in heavy-maintenance.yml. Keeping only the
        # cheap SQL-side stats refresh here keeps Neon transfer near zero.
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          RUN_SCRAPERS: "false"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_DEAL_SCORE_REFRESH: "false"
          RUN_STATS_CACHE_REFRESH: "true"
          RUN_DEDUP: "false"
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          RUN_PRICE_RECOVERY: "false"
          RUN_ALERT_MATCH: "false"
          RUN_THUMBNAIL_CACHE: "false"
          RUN_IMAGE_PHASH: "false"
        run: python run_sync.py

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  snapshot-export:
    runs-on: ubuntu-latest
    needs: [neon-guard, scrape-source, market-analysis]
    if: ${{ needs.neon-guard.outputs.available == 'true' && always() && !cancelled() && needs.market-analysis.result == 'success' }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Export public snapshots (stats-only — catalog refreshes weekly)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python export_public_snapshots.py --output snapshots/latest --skip-catalog

      - name: Upload snapshots to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          SNAPSHOT_SOURCE_DIR: snapshots/latest
        run: python upload_snapshots_r2.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Deploy snapshots to Vercel production
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_SOURCE_DIR: backend/snapshots/latest
        run: bash scripts/deploy-snapshots-to-prod.sh

      - name: Upload manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midday-public-snapshot-manifest-${{ github.run_id }}
          path: backend/snapshots/latest/manifest.json
          retention-days: 14

      - name: Notify Slack on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Workflow '${{ github.workflow }}' job '${{ github.job }}' failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"
