name: Backend tests (reusable)

# Single definition of the backend test gate. Called by CI (push/PR) and by
# deploy-hf-backend.yml, so a red backend suite blocks the HF deploy.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ALLOW_SQLITE_FALLBACK: "true"
      APP_ACCESS_ENFORCED: "false"
      PRO_ACCESS_ENFORCED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: python -m pytest tests/ -v --tb=short
