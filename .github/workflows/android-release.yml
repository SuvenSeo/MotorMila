# Publishes an installable Motormila APK as a GitHub Release.
# Trigger: git tag android-v* (e.g. android-v1.0.0) or workflow_dispatch.
#
# The APK is sideload-signed (SDK debug key unless ANDROID_KEYSTORE_* secrets
# are set). Not for Play Store. Enable "install unknown apps" on the device.
name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No sdkmanager found under $ANDROID_HOME; relying on runner defaults"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve sideload keystore
        working-directory: .
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          # The committed android/ci-signing.keystore gives every release the
          # same signature, so in-app updates install over previous versions.
          # (Before 1.5.1 a fresh debug key was generated per CI run, which
          # blocked in-place upgrades — do not reintroduce key generation.)
          #
          # Stage the effective identity to one fixed path and hand that PATH
          # to Gradle (blank-tolerant in build.gradle.kts). Previously the
          # secret branch only echoed and never materialized the keystore, so
          # a secret-keyed release would have silently shipped with the legacy
          # signature.
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/motormila-sideload.keystore"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_FILE" | base64 --decode > "$KEYSTORE"
            echo "ANDROID_KEYSTORE_FILE secret present: using secret identity."
          else
            test -f android/ci-signing.keystore || {
              echo "ERROR: android/ci-signing.keystore missing — release would get a new signature and block in-place updates"
              exit 1
            }
            cp android/ci-signing.keystore "$KEYSTORE"
            echo "WARNING: using committed sideload keystore (public, shared dev identity)."
            echo "Migrate to ANDROID_KEYSTORE_FILE; see docs/ANDROID_SIGNING.md."
          fi
          echo "MOTORMILA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Using stable sideload signature."

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.MOTORMILA_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK
        id: apk
        working-directory: .
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$SRC" ]]; then
            echo "ERROR: $SRC missing"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi
          VERSION="$(echo "${GITHUB_REF_NAME}" | sed 's/^android-v//')"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="1.0.0-${GITHUB_SHA:0:7}"
          fi
          NAME="motormila-${VERSION}.apk"
          mkdir -p dist
          cp "$SRC" "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motormila-apk
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        working-directory: .
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="android-v${{ steps.apk.outputs.version }}"
          fi
          NOTES_FILE="$(mktemp)"
          {
            echo "Sideload preview of the Motormila Android app (package \`lk.motormila.app\`)."
            echo
            echo "- Install: download the APK, enable **Install unknown apps**, open the file."
            echo "- API: production Hugging Face backend."
            echo "- Signed with the stable Motormila sideload key (not a Play Store upload key). Future releases install over this one without uninstalling."
            echo "- Guest browse works without signing in; Pro / alerts / dealer still need an invite."
            echo
            echo "Built from \`${GITHUB_SHA}\`."
          } > "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --title "Motormila Android ${{ steps.apk.outputs.version }}" \
              --notes-file "$NOTES_FILE"
          fi
          echo "Published $TAG"

      - name: Upload APK to R2 (public download)
        working-directory: .
        env:
          # Same credentials the snapshot workflows use; the uploader falls
          # back to the Cloudflare API when S3-style R2_* creds are absent.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: motormila-snapshots
          R2_PREFIX: app
          SNAPSHOT_SOURCE_DIR: dist
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python backend/upload_snapshots_r2.py
          echo "APK live at https://pub-f15911ef9a914db9a44e1fd6b47dfe4e.r2.dev/app/${{ steps.apk.outputs.name }}"

      - name: Commit release manifest (drives the in-app update checker)
        working-directory: .
        run: |
          set -euo pipefail
          VERSION="${{ steps.apk.outputs.version }}"
          VERSION_CODE="$(grep -oP 'versionCode\\s*=\\s*\\K[0-9]+' android/app/build.gradle.kts | head -1)"
          # Public R2 URL (bucket motormila-snapshots has its managed r2.dev
          # domain enabled). The backend's /releases/app serves this to the
          # in-app updater via the site manifest below.
          APK_URL="https://pub-f15911ef9a914db9a44e1fd6b47dfe4e.r2.dev/app/${{ steps.apk.outputs.name }}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p android public/app
          for DEST in android/latest-release.json public/app/latest-release.json; do
          cat > "$DEST" <<EOF
          {
            "version": "${VERSION}",
            "version_code": ${VERSION_CODE},
            "apk_url": "${APK_URL}",
            "published_at": "${PUBLISHED_AT}",
            "tag": "${GITHUB_REF_NAME}"
          }
          EOF
          done
          cat android/latest-release.json
          git config user.name "motormila-release-bot"
          git config user.email "noreply@motormila.lk"
          git add android/latest-release.json public/app/latest-release.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged; nothing to commit"
          else
            git commit -m "chore(release): android-v${VERSION} (versionCode ${VERSION_CODE}) [skip ci]"
            # Rebase onto latest main first: the tag checkout goes stale if
            # main moved since the release run started (bit 1.5.4).
            git fetch origin main
            git rebase origin/main
            git push origin "HEAD:main"
            echo "Manifest pushed to main"
          fi
