# Publishes an installable Motormila APK as a GitHub Release.
# Trigger: git tag android-v* (e.g. android-v1.0.0) or workflow_dispatch.
#
# The APK is the "direct" (sideload) flavor, signed ONLY with the
# ANDROID_KEYSTORE_* secrets (the run fails without them). The Play build is
# the "play" flavor AAB (bundlePlayRelease), uploaded to Play Console manually.
name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "No sdkmanager found under $ANDROID_HOME; relying on runner defaults"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # A manual run is an artifact-only candidate. Stable publishing requires
      # an exact numeric tag matching the version compiled into the APK.
      - name: Check distribution identity
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          stable=false
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF" == "refs/tags/android-v$version" ]]
            stable=true
          fi
          printf 'stable=%s\nversion=%s\n' "$stable" "$version" >> "$GITHUB_OUTPUT"

      - name: Resolve sideload keystore
        working-directory: .
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          # 2026-10 overhaul: the committed public keystore was removed. The
          # release identity comes ONLY from the ANDROID_KEYSTORE_* secrets;
          # without them the release fails here (and Gradle's signing guard
          # would fail it again). See docs/overhaul/android.md "Signing".
          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/motormila-release.keystore"
          if [ -z "${ANDROID_KEYSTORE_FILE:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_FILE secret is not set. Release signing is env/secret-only (docs/overhaul/android.md)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_FILE" | base64 --decode > "$KEYSTORE"
          echo "MOTORMILA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Using the ANDROID_KEYSTORE_FILE secret identity."

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.MOTORMILA_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Sideload channel = the "direct" flavor (self-updater + SHA-256 check).
        run: ./gradlew :app:assembleDirectRelease --stacktrace

      - name: Stage APK
        id: apk
        working-directory: .
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/direct/release/app-direct-release.apk"
          if [[ ! -f "$SRC" ]]; then
            echo "ERROR: $SRC missing"
            ls -la android/app/build/outputs/apk/direct/release || true
            exit 1
          fi
          VERSION="${{ steps.channel.outputs.version }}"
          NAME="motormila-${VERSION}.apk"
          mkdir -p dist
          cp "$SRC" "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "path=dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh "dist/${NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: motormila-apk
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Prepare conditional R2 client
        if: steps.channel.outputs.stable == 'true'
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/pip" install boto3==1.43.53

      - name: Preflight and create immutable stable APKs
        if: steps.channel.outputs.stable == 'true'
        working-directory: .
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts | head -1)"
          git fetch --no-tags origin main
          MANIFEST_DIR=$(mktemp -d "$RUNNER_TEMP/immutable-release.XXXXXXXX")
          printf 'MANIFEST_DIR=%s\nMANIFEST_BASE=%s\n' "$MANIFEST_DIR" "$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/release-venv/bin/python" scripts/immutable_release.py \
            "$APK" "$VERSION_CODE" "$MANIFEST_DIR/latest-release.json"

      - name: Commit verified release manifest (drives the in-app update checker)
        if: steps.channel.outputs.stable == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          MANIFEST="$MANIFEST_DIR/latest-release.json"
          [[ -f "$MANIFEST" ]] || exit 0  # already identical in both locations
          # Parent the manifest-only commit on the exact main read at preflight.
          # A concurrent main update must reject the push, not be rebased over.
          git switch --detach "$MANIFEST_BASE"
          cp "$MANIFEST" android/latest-release.json
          cp "$MANIFEST" public/app/latest-release.json
          git config user.name "motormila-release-bot"
          git config user.email "hello@ardenostudio.com"
          git add android/latest-release.json public/app/latest-release.json
          git commit -m "chore(release): ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main
