# Reusable probe: is Neon still accepting connections?
#
# Neon Free blocks ALL connections once monthly transfer quota is exhausted.
# Callers skip Neon-backed scrapes/maintenance instead of failing, while
# Manus → merged SQLite keeps the live catalog updating.
name: Probe Neon availability

on:
  workflow_call:
    outputs:
      available:
        description: "true when Neon accepted SELECT 1"
        value: ${{ jobs.probe.outputs.available }}

permissions:
  contents: read

jobs:
  probe:
    name: Probe Neon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install psycopg2
        run: python -m pip install psycopg2-binary

      - name: Probe Neon
        id: probe
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
        run: python backend/scripts/ops/probe_neon.py
