# TEMPORARY workflow for branch android/apple-polish ONLY. DELETE BEFORE MERGE.
# - build:  directPreview sideload APK (non-debuggable, R8; artifact qa-apk) + baselineprofile test APK.
# - perf:   baseline profile generation + macrobenchmarks on an emulator (artifact perf-out).
# - tests:  play+direct unit tests + Paparazzi verify.
# - record-goldens: only when the head commit message contains [record-goldens];
#   re-records Paparazzi goldens and commits them back to this branch.
# - crawl:  API 34 emulator screenshot crawl of every screen in en/si x light/dark
#   (+ en light at 200% font scale). Artifacts qa-crawl-<config>.
# - preview: only when the head commit message contains [publish-preview]:
#   replaces MotorMila-1.7.0-preview-sideload.apk on the existing pre-release
#   preview-android-1.7.0. Never tags android-v*, never touches the OTA manifest.
name: Android apple-polish preview (temporary)

on:
  push:
    branches: [android/apple-polish]
  workflow_dispatch:

concurrency:
  group: android-apple-polish-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record-goldens:
    if: contains(github.event.head_commit.message, '[record-goldens]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: SDK platform 36
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null || true
      - name: Record Paparazzi goldens
        run: |
          chmod +x gradlew
          rm -rf app/src/test/snapshots/images
          ./gradlew :app:recordPaparazziPlayDebug --stacktrace
      - name: Commit goldens
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android/app/src/test/snapshots
          if git diff --cached --quiet; then echo "no golden changes"; exit 0; fi
          git commit -m "test(android): re-record Paparazzi goldens (apple-polish: Cal Sans, light default)"
          git push origin HEAD:${GITHUB_REF_NAME}

  build:
    if: "!contains(github.event.head_commit.message, '[record-goldens]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: SDK platform 36
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null || true
      - name: Assemble directPreview (non-debuggable, R8, preview key, increasing versionCode) + baseline-profile test APK
        run: |
          set -euo pipefail
          export MOTORMILA_PREVIEW_VERSION_CODE=$(( $(date +%s) / 60 ))
          echo "versionCode=$MOTORMILA_PREVIEW_VERSION_CODE"
          chmod +x gradlew && ./gradlew :app:assembleDirectPreview :baselineprofile:assemblePreview --stacktrace
          grep -h "VERSION_CODE\|PREVIEW_UPDATE\|QA_HOOKS\|DEBUG" app/build/generated/source/buildConfig/direct/preview/lk/motormila/app/BuildConfig.java
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK="$(ls app/build/outputs/apk/direct/preview/*.apk | head -1)"
          "$BT/aapt2" dump badging "$APK" | head -1
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then echo "preview APK is debuggable!"; exit 1; fi
          echo "debuggable: no"; ls -la "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          ls -la baselineprofile/build/outputs/apk/preview/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-apk
          path: android/app/build/outputs/apk/direct/preview/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bp-apk
          path: android/baselineprofile/build/outputs/apk/preview/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r8-mapping
          path: android/app/build/outputs/mapping/directPreview/
          if-no-files-found: ignore
          retention-days: 7

  perf:
    # Baseline Profile generation + FrameTiming/Startup macrobenchmarks on the
    # preview build. Informational: never blocks the preview publish.
    needs: build
    if: "!contains(github.event.head_commit.message, '[skip-perf]')"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: bp-apk
          path: bpapk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Baseline profile + macrobenchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: false
          script: bash .github/qa/perf.sh "$(ls apk/*.apk | head -1)" "$(ls bpapk/*.apk | head -1)" perf-out
      - name: Upload perf
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-out
          path: perf-out/
          if-no-files-found: warn
          retention-days: 14

  tests:
    if: "!contains(github.event.head_commit.message, '[record-goldens]')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: SDK platform 36
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null || true
      - run: chmod +x gradlew
      - name: Unit tests (play + direct)
        run: ./gradlew :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest --stacktrace
      - name: Verify Paparazzi snapshots
        run: ./gradlew :app:verifyPaparazziPlayDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            android/app/build/reports/
            android/app/src/test/snapshots/images/
          if-no-files-found: ignore
          retention-days: 7

  crawl:
    needs: build
    if: "!contains(github.event.head_commit.message, '[skip-crawl]')"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: en, theme: light, font: "1.0", subset: "", motion: "1" }
          - { lang: en, theme: dark, font: "1.0", subset: "", motion: "0" }
          - { lang: si, theme: light, font: "1.0", subset: "", motion: "0" }
          - { lang: si, theme: dark, font: "1.0", subset: "", motion: "0" }
          - { lang: en, theme: light, font: "2.0", motion: "0", subset: "home,home_scrolled,home_scrolled_up,search,search_scrolled,filter_sheet,search_compare_tray,search_compare_tray_scrolled,compare_from_tray,compare_from_tray_scrolled,compare_removed,detail,detail_scrolled,settings,profile,tools,sign_in,valuation,watchlist,pricing,alerts,price_index" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshot crawl
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python3 .github/qa/apple_crawl.py --apk "$(ls apk/*.apk | head -1)" --out qa-out --lang ${{ matrix.lang }} --theme ${{ matrix.theme }} --font ${{ matrix.font }} --subset "${{ matrix.subset }}" --motion "${{ matrix.motion }}"
      - name: Upload crawl
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-crawl-${{ matrix.lang }}-${{ matrix.theme }}-font${{ matrix.font }}
          path: qa-out/
          if-no-files-found: warn
          retention-days: 14

  functional:
    # Functional E2E QA (adb + uiautomator): real actions asserted against the
    # live API. Informational: never blocks the preview publish.
    needs: build
    if: "!contains(github.event.head_commit.message, '[skip-functional]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # The live backend is slow (10-30 s filtered queries): at most 2 emulators hit it at once.
      max-parallel: 2
      matrix:
        include:
          - { api: 34, shard: a, only: "L,H,S1,S2,S3,S4,S5,S6" }
          - { api: 34, shard: b, only: "S7,S8,S9" }
          - { api: 34, shard: c, only: "S10,S11,S12,S13,S14,S15,D,C,U" }
          - { api: 34, shard: d, only: "A,G,X,Y,Z1" }
          - { api: 34, shard: e, only: "Z2" }
          - { api: 36, shard: f, only: "L3,H6,S2,S15,D3,X2,G3,Z1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: apk
      - name: Older preview APK (self-updater check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p oldapk
          gh run download 39942567989 -n qa-apk -D oldapk -R "$GITHUB_REPOSITORY" || true
          ls -la oldapk || true
          pip install --quiet pillow || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Functional QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python3 .github/qa/functional_qa.py --apk "$(ls apk/*.apk | head -1)" --old-apk "$(ls oldapk/*.apk 2>/dev/null | head -1)" --out fq-out --only "${{ matrix.only }}"
      - name: Upload functional QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-api${{ matrix.api }}-${{ matrix.shard }}
          path: fq-out/
          if-no-files-found: warn
          retention-days: 14

  preview:
    needs: [build, tests]
    if: contains(github.event.head_commit.message, '[publish-preview]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: apk
      - name: Replace APK on pre-release preview-android-1.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls apk/*.apk | head -1)"
          cp "$APK" MotorMila-1.7.0-preview-sideload.apk
          sha256sum MotorMila-1.7.0-preview-sideload.apk
          gh release view preview-android-1.7.0 -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease | grep -q true
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          CODE="$("$BT/aapt2" dump badging MotorMila-1.7.0-preview-sideload.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
          SHA="$(sha256sum MotorMila-1.7.0-preview-sideload.apk | cut -d' ' -f1)"
          # Preview self-updater manifest (read only by the debug/preview app).
          printf '{"version":"1.7.0-preview","version_code":%s,"apk_url":"https://github.com/%s/releases/download/preview-android-1.7.0/MotorMila-1.7.0-preview-sideload.apk","sha256":"%s","notes":"Preview build %s","published_at":"%s"}\n' \
            "$CODE" "$GITHUB_REPOSITORY" "$SHA" "${GITHUB_SHA::7}" "$(date -u +%FT%TZ)" > preview-latest.json
          cat preview-latest.json
          gh release upload preview-android-1.7.0 MotorMila-1.7.0-preview-sideload.apk preview-latest.json --clobber -R "$GITHUB_REPOSITORY"
          gh release view preview-android-1.7.0 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name) \(.updatedAt) \(.size)"'
