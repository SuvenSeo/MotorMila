# TEMPORARY workflow for branch android/apple-polish ONLY. DELETE BEFORE MERGE.
# - build:  directDebug sideload APK (artifact qa-apk).
# - tests:  play+direct unit tests + Paparazzi verify.
# - record-goldens: only when the head commit message contains [record-goldens];
#   re-records Paparazzi goldens and commits them back to this branch.
# - crawl:  API 34 emulator screenshot crawl of every screen in en/si x light/dark
#   (+ en light at 200% font scale). Artifacts qa-crawl-<config>.
# - preview: only when the head commit message contains [publish-preview]:
#   replaces MotorMila-1.7.0-preview-sideload.apk on the existing pre-release
#   preview-android-1.7.0. Never tags android-v*, never touches the OTA manifest.
name: Android apple-polish preview (temporary)

on:
  push:
    branches: [android/apple-polish]
  workflow_dispatch:

concurrency:
  group: android-apple-polish-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record-goldens:
    if: contains(github.event.head_commit.message, '[record-goldens]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: SDK platform 36
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null || true
      - name: Record Paparazzi goldens
        run: |
          chmod +x gradlew
          rm -rf app/src/test/snapshots/images
          ./gradlew :app:recordPaparazziPlayDebug --stacktrace
      - name: Commit goldens
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android/app/src/test/snapshots
          if git diff --cached --quiet; then echo "no golden changes"; exit 0; fi
          git commit -m "test(android): re-record Paparazzi goldens (apple-polish: Cal Sans, light default)"
          git push origin HEAD:${GITHUB_REF_NAME}

  build:
    if: "!contains(github.event.head_commit.message, '[record-goldens]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: SDK platform 36
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null || true
      - name: Assemble directDebug
        run: chmod +x gradlew && ./gradlew :app:assembleDirectDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-apk
          path: android/app/build/outputs/apk/direct/debug/*.apk

  tests:
    if: "!contains(github.event.head_commit.message, '[record-goldens]')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: SDK platform 36
        run: |
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null || true
      - run: chmod +x gradlew
      - name: Unit tests (play + direct)
        run: ./gradlew :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest --stacktrace
      - name: Verify Paparazzi snapshots
        run: ./gradlew :app:verifyPaparazziPlayDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            android/app/build/reports/
            android/app/src/test/snapshots/images/
          if-no-files-found: ignore
          retention-days: 7

  crawl:
    needs: build
    if: "!contains(github.event.head_commit.message, '[skip-crawl]')"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: en, theme: light, font: "1.0", subset: "" }
          - { lang: en, theme: dark, font: "1.0", subset: "" }
          - { lang: si, theme: light, font: "1.0", subset: "" }
          - { lang: si, theme: dark, font: "1.0", subset: "" }
          - { lang: en, theme: light, font: "2.0", subset: "home,search,detail,detail_scrolled,settings,profile,tools,sign_in,valuation,watchlist" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshot crawl
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python3 .github/qa/apple_crawl.py --apk "$(ls apk/*.apk | head -1)" --out qa-out --lang ${{ matrix.lang }} --theme ${{ matrix.theme }} --font ${{ matrix.font }} --subset "${{ matrix.subset }}"
      - name: Upload crawl
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-crawl-${{ matrix.lang }}-${{ matrix.theme }}-font${{ matrix.font }}
          path: qa-out/
          if-no-files-found: warn
          retention-days: 14

  preview:
    needs: [build, tests]
    if: contains(github.event.head_commit.message, '[publish-preview]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: apk
      - name: Replace APK on pre-release preview-android-1.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls apk/*.apk | head -1)"
          cp "$APK" MotorMila-1.7.0-preview-sideload.apk
          sha256sum MotorMila-1.7.0-preview-sideload.apk
          gh release view preview-android-1.7.0 -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease | grep -q true
          gh release upload preview-android-1.7.0 MotorMila-1.7.0-preview-sideload.apk --clobber -R "$GITHUB_REPOSITORY"
          gh release view preview-android-1.7.0 -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name) \(.updatedAt) \(.size)"'
