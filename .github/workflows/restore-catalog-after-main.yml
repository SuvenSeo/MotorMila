# Restore the public listing catalog after every push to main.
#
# The Cloudflare Pages build deploys the git tree only. listing-catalog*.json
# is gitignored (too large), so a main push wipes the catalog and the SPA
# falls through to the live API. When Neon Free has exhausted transfer quota,
# that API is down until the 1st of the month.
#
# This job rebuilds the catalog from the durable merged SQLite release
# (zero Neon reads), uploads it to R2, then triggers a Pages rebuild (retry
# of the latest github:push production deployment) so browsing never
# depends on Neon again.
name: Restore production catalog snapshots

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: restore-production-catalog
  # Do not cancel an in-flight restore. This job is what re-publishes the
  # listing catalog after a deploy, so killing it part-way (e.g. a rapid push
  # pair, where the newer run cancels the older) can leave production serving a
  # stale or partial catalog. Runs in this group are serialized instead.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    name: Export SQLite catalog, upload to R2, rebuild Pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0


      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Restore merged SQLite catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view merged-db >/dev/null 2>&1; then
            gh release download merged-db \
              --pattern "merged-motormila.db.gz" --pattern "merged-autolens.db.gz" \
              --dir . --clobber
          else
            echo "ERROR: merged-db release is missing" >&2
            exit 1
          fi
          if [[ -s merged-motormila.db.gz ]]; then
            gunzip -f -c merged-motormila.db.gz > backend/motormila.db
          else
            gunzip -f -c merged-autolens.db.gz > backend/motormila.db  # legacy asset name
          fi
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("backend/motormila.db")
          n = con.execute("SELECT COUNT(*) FROM car_listings").fetchone()[0]
          print(f"merged SQLite listings: {n}")
          if n < 1000:
              raise SystemExit("merged DB looks empty; refusing to deploy")
          PY

      - name: Export public snapshots from SQLite
        env:
          ALLOW_SQLITE_FALLBACK: "true"
          COLD_DATABASE_URL: sqlite:///backend/motormila.db
        run: |
          set -euo pipefail
          python backend/export_public_snapshots.py --output backend/snapshots/latest
          mkdir -p public/snapshots/latest
          cp -r backend/snapshots/latest/. public/snapshots/latest/

      - name: Publish failover DB into snapshots
        run: |
          set -euo pipefail
          # The merged DB is gitignored, so the git-triggered Pages build
          # wipes it from production. Rebuild it here from the durable
          # merged-db release asset (restored above) instead of trusting the
          # live site to still serve it: once the live copy is gone, the
          # preserve-from-live fallback 404s and every restore redeploys
          # without the DB, leaving the HF backend with no failover.
          python -c "import sqlite3; c=sqlite3.connect('backend/motormila.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          gzip -f -c backend/motormila.db > public/snapshots/latest/merged-motormila.db.gz
          cp public/snapshots/latest/merged-motormila.db.gz \
            public/snapshots/latest/merged-autolens.db.gz  # legacy name
          ls -lh public/snapshots/latest/merged-*.db.gz
          # The R2 upload step below reads backend/snapshots/latest, not
          # public/ — copy the dumps there too so the public R2 bucket the
          # HF backend downloads failover from stays fresh (2026-10-16: the
          # gz no longer rides the site deploy (Pages rejects files >25 MiB);
          cp public/snapshots/latest/merged-*.db.gz backend/snapshots/latest/

      - name: Upload restored snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restored-catalog-${{ github.sha }}
          path: public/snapshots/latest
          retention-days: 7

      - name: Upload snapshots to R2 when configured
        id: r2_upload
        working-directory: backend
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          SNAPSHOT_SOURCE_DIR: snapshots/latest
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || [ -z "${R2_BUCKET}" ]; then
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            echo "R2 secrets not set; skipping CDN upload (no Pages rebuild will be triggered)."
            exit 0
          fi
          python upload_snapshots_r2.py
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Cloudflare Pages rebuild (retry latest github:push production deployment)
        if: steps.r2_upload.outputs.uploaded == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/trigger-pages-rebuild.py
