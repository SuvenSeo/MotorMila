# Riyasewana Deep Backfill (Neon-first)
#
# One-shot / scheduled deep crawl of riyasewana.com using the scraper's fast
# plain-HTTP mode (curl_cffi Chrome impersonation; no Playwright browser).
# Riyasewana's full catalog runs to ~2,000+ pages across categories (cars ~534,
# motorcycles ~700, suvs ~171, vans ~151, three-wheels ~161, lorries ~123 ...),
# vs the 60 pages/day the daily pipeline touches.  This is the tool to run to
# recover listings missed while scrapers were paused.
#
# RIYASEWANA_FLAT_BUDGET=true gives every category the full page budget instead
# of any rationed secondary share, so a large max_pages crawls the whole catalog
# deeply.  The scraper honors the SERP's own pagination hint and stops at each
# category's true last page.  start_page segments a crawl that is deeper than one
# run can reach, instead of re-reading the same head of the catalogue.
#
# DB WRITES ONLY (ingress is free on Neon). Optional snapshot refresh afterwards
# keeps the public Vercel/R2 catalog in sync — run it with refresh_catalog=true.
#
# Run: Actions → "Riyasewana Deep Backfill" → Run workflow
#   max_pages: 800 covers every category to its last page in one pass
#   start_page: 1 for the newest pages; 801 to continue deeper past a first
#               800-page pass instead of re-crawling it

name: Riyasewana Deep Backfill

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Page budget per category (800 = full catalog depth)"
        type: string
        default: "800"
      start_page:
        description: "First listing page to crawl. Use to walk a segment deeper: a run that starts at 1 re-reads pages 1..max_pages and never gets past them."
        type: string
        default: "1"
      refresh_catalog:
        description: "Deploy snapshots straight from Neon. Leave OFF: manus-to-live.yml owns the public catalog and will overwrite these within 6h. For a durable backfill run 'Neon Export' afterwards — it publishes a neon-export-* release that manus-to-live merges into the merged SQLite."
        type: boolean
        default: false

concurrency:
  group: riyasewana-bulk-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-riyasewana:
    # Was `runs-on: self-hosted` (the laptop runner), so this workflow could
    # never execute — meaning the ONE source with a dedicated deep-backfill
    # tool, and 54% of the live catalog, had no working recovery path at all.
    #
    # Note the deliberate choice of ONE job rather than a retry matrix: each leg
    # of a matrix would be a separate runner (a fresh IP is the only thing that
    # defeats the Cloudflare block) but they would then write to Neon
    # concurrently and contend on the same upserts. If this run reports
    # `http_blocked`, just re-dispatch — a blocked attempt now fails in ~0.1s
    # instead of burning the 4-hour budget, so re-dispatching is cheap.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure schema (idempotent)
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: python -c "from db.session import init_db; init_db(); print('Schema ready.')"

      - name: Count riyasewana listings before
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from db.session import cold_engine
          with cold_engine.connect() as c:
              total = c.execute(text("select count(*) from car_listings where source='riyasewana' and is_active is true")).scalar()
              print(f"riyasewana_active_before={total}")
          PY

      - name: Run riyasewana deep HTTP backfill
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          SCRAPE_PROFILE: "all"
          SCRAPE_ENABLED_SOURCES: "riyasewana"
          RUN_SCRAPERS: "true"
          RUN_MARKET_ANALYSIS: "false"
          RUN_MARKET_SIGNALS: "false"
          RUN_LISTING_LIFECYCLE: "false"
          RUN_OUTLIER_DETECTION: "false"
          SCRAPE_MAX_PAGES: "20"
          SCRAPE_MAX_PAGES_RIYASEWANA: ${{ github.event.inputs.max_pages || '800' }}
          SCRAPE_SOURCE_TIMEOUT_SECONDS: "10800"
          SCRAPE_SOURCE_TIMEOUT_SECONDS_RIYASEWANA: "10800"
          # Fast plain-HTTP crawl (curl_cffi Chrome impersonation) — no browser.
          RIYASEWANA_SCRAPE_MODE: "http"
          # Full budget for every category so the whole catalog is covered.
          RIYASEWANA_FLAT_BUDGET: "true"
          RIYASEWANA_START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          # Optional residential proxy. Without it this run depends on drawing a
          # GitHub runner IP that riyasewana's Cloudflare does not block.
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
        run: python run_sync.py

      - name: Count riyasewana listings after
        if: always()
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from db.session import cold_engine
          with cold_engine.connect() as c:
              total = c.execute(text("select count(*) from car_listings where source='riyasewana' and is_active is true")).scalar()
              recent = c.execute(text("select count(*) from car_listings where source='riyasewana' and scraped_at > now() - interval '12 hours'")).scalar()
              print(f"riyasewana_active_after={total}")
              print(f"riyasewana_scraped_last_12h={recent}")
          PY

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=":rotating_light: Riyasewana deep backfill failed. Run: ${RUN_URL}"
          curl -X POST -H "Content-type: application/json" --data "{\"text\":\"${MESSAGE}\"}" "${SLACK_WEBHOOK_URL}"

  refresh-snapshots:
    runs-on: ubuntu-latest
    needs: scrape-riyasewana
    if: ${{ !cancelled() && needs.scrape-riyasewana.result == 'success' && inputs.refresh_catalog }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps (DB export fallback)
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Refresh via Vercel snapshot export API (preferred — one big read)
        id: vercel_export
        continue-on-error: true
        env:
          SNAPSHOT_EXPORT_SECRET: ${{ secrets.SNAPSHOT_EXPORT_SECRET }}
        run: |
          if [ -z "${SNAPSHOT_EXPORT_SECRET}" ]; then
            echo "SNAPSHOT_EXPORT_SECRET not set — will try DB export fallback."
            exit 1
          fi
          node scripts/pull-vercel-snapshots.mjs

      - name: Fallback — export from HOT_DATABASE_URL
        if: steps.vercel_export.outcome != 'success'
        working-directory: backend
        env:
          COLD_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
        run: |
          if [ -z "${HOT_DATABASE_URL}" ]; then
            echo "ERROR: HOT_DATABASE_URL secret missing; cannot export snapshots."
            exit 1
          fi
          # export_public_snapshots.py already splits the catalog into
          # listing-catalog-part-NNN.json files internally — do NOT chain
          # split-listing-catalog.mjs here (it clobbers the parts manifest
          # to a 0-item catalog because it expects a monolithic items array).
          python export_public_snapshots.py --output ../public/snapshots/latest

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riyasewana-backfill-snapshots-${{ github.run_id }}
          path: public/snapshots/latest/
          retention-days: 7
          if-no-files-found: error

      - name: Optional R2 upload
        continue-on-error: true
        working-directory: backend
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          SNAPSHOT_SOURCE_DIR: ../public/snapshots/latest
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || [ -z "${R2_BUCKET}" ]; then
            echo "R2 secrets not fully configured — skipping R2 upload."
            exit 0
          fi
          pip install -q boto3
          python upload_snapshots_r2.py

      - name: Deploy snapshots to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SNAPSHOT_SOURCE_DIR: public/snapshots/latest
        run: bash scripts/deploy-snapshots-to-prod.sh
