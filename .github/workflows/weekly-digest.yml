# Neon-first: digest reads aggregate/ScrapeRun data (small, bounded). Runs
# weekly on Mondays; public browsing reads R2 snapshots, not this API.
name: Weekly Pro Digest

# Dispatch-only: the digest is a pro feature, and the scheduled Monday run
# kept Neon warm weekly (compute-hours) for a job that only ever ran during
# manual verification. Run it manually when you want to send a digest.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print to stdout only, no emails sent)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate script compiles
        run: python -m py_compile scripts/send_pro_digest.py

      - name: Run digest (dry-run default)
        if: ${{ inputs.dry_run == 'true' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          # AUTH_USERS is read to resolve pro-recipient list; omit to fall back
          # to DIGEST_RECIPIENTS.
          AUTH_USERS: ${{ secrets.AUTH_USERS }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL || 'noreply@autolens.lk' }}
          DIGEST_SUBJECT: ${{ vars.DIGEST_SUBJECT || 'AutoLens Pro — Weekly Market Digest' }}
          # SENDGRID_API_KEY intentionally NOT set here → forces dry-run mode.
        run: python scripts/send_pro_digest.py --dry-run

      - name: Send live digest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false' }}
        env:
          HOT_DATABASE_URL: ${{ secrets.HOT_DATABASE_URL }}
          ALLOW_SQLITE_FALLBACK: "false"
          AUTH_USERS: ${{ secrets.AUTH_USERS }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL || 'noreply@autolens.lk' }}
          DIGEST_SUBJECT: ${{ vars.DIGEST_SUBJECT || 'AutoLens Pro — Weekly Market Digest' }}
        run: python scripts/send_pro_digest.py
