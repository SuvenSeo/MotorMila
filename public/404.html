<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — MotorMila</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#09090B" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      Static 404 for hard loads of unknown URLs (vercel.json only rewrites
      known SPA routes to index.html, so Vercel serves this file for the rest
      with a real 404 status). Self-contained: no app bundle, ~3 KB.
      Client-side unknown routes render src/pages/NotFound.tsx instead.
    -->
    <style>
      :root { color-scheme: dark; --ink: #09090b; --card: #141417; --line: #27272a; --text: #fafafa; --muted: #a1a1aa; --blue: #0a7aff; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --ink: #f8f4ee; --card: #ffffff; --line: #e4e4e7; --text: #09090b; --muted: #52525b; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
      main { width: 100%; max-width: 560px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; }
      .brand img { display: block; width: auto; height: 28px; }
      h1 { margin: 28px 0 8px; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: var(--muted); }
      form { display: flex; gap: 8px; flex-wrap: wrap; }
      input { flex: 1 1 240px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 0 14px; font-size: 16px; }
      input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      button { height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
      ul { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
      li a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; font-size: 14px; }
      li a:hover { border-color: var(--blue); }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="MotorMila home">
        <picture>
          <source srcset="/logo-wordmark-light.svg" media="(prefers-color-scheme: light)" />
          <img src="/logo-wordmark-dark.svg" alt="MotorMila" width="167" height="28" />
        </picture>
      </a>
      <h1>Page not found</h1>
      <p>We couldn't find that page. It may have moved, or the ad may have been removed. Search for the car instead:</p>
      <form action="/" method="get" role="search">
        <label for="q" style="position:absolute;left:-9999px">Search vehicles</label>
        <input id="q" name="q" type="search" placeholder="e.g. Toyota Aqua 2015" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <ul>
        <li><a href="/">Browse listings</a></li>
        <li><a href="/estimate">Value my car</a></li>
        <li><a href="/compare">Compare cars</a></li>
        <li><a href="/trends">Price trends</a></li>
        <li><a href="/how-we-price">How we score prices</a></li>
      </ul>
    </main>
    <script>
      // Prefill the search from the dead URL ("/toyota-aqua-2015" → "toyota aqua 2015").
      (function () {
        try {
          var last = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
          var words = last.replace(/\.(html?|php|aspx?)$/i, "").split(/[^a-zA-Z0-9]+/).filter(function (w) {
            return w.length > 1 && !/^(listing|listings|cars?|ad|ads|item|p|id)$/i.test(w);
          });
          if (words.length) document.getElementById("q").value = words.slice(0, 4).join(" ");
        } catch (e) {}
      })();
    </script>
  </body>
</html>
